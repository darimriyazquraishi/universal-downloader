name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android_app/**'
      - '.github/workflows/build_apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer & Dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Setup Custom Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Universal Downloader, OU=Media Distribution, O=Universal Media Inc, L=San Jose, ST=CA, C=US"

      - name: Build APK with Buildozer
        working-directory: ./android_app
        run: |
          yes | buildozer -v android debug

      - name: Production Sign APK with apksigner (v1, v2, v3 schemes)
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias universalmedia \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "Universal2026Media!" \
            -keypass "Universal2026Media!" \
            -dname "CN=Universal Downloader, OU=Media Distribution, O=Universal Media Inc, L=San Jose, ST=CA, C=US"

          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Found apksigner at: $APKSIGNER"

          for apk in android_app/bin/*.apk; do
            echo "Signing $apk with release keystore..."
            $APKSIGNER sign \
              --ks release.jks \
              --ks-key-alias universalmedia \
              --ks-pass pass:Universal2026Media! \
              --key-pass pass:Universal2026Media! \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --v4-signing-enabled false \
              "$apk"
            $APKSIGNER verify --verbose "$apk"
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalDownloader-Android-APK
          path: android_app/bin/*.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.10-mobile
          name: Universal Downloader Android APK v1.0.10
          body: |
            ### 📱 Universal Downloader for Android (v1.0.10) - High-Refresh Fluid UI Edition
            - **Native 90Hz/120Hz/144Hz Unlocked Rendering**: Configured GPU rendering engine (`maxfps: 0`) to dynamically match high-refresh display hardware on modern Android devices for buttery smooth 120 FPS animations.
            - **Zero-Latency Touch & Scroll**: Re-tuned scroll deadzones (`scroll_distance: dp(6)`, `scroll_timeout: 180ms`) across all tabs for instant, responsive flick gestures without sluggish start lag.
            - **Intelligent Gesture Isolation**: Vertical scrolling in lists now automatically locks horizontal tab swiping so scrolling is 100% uninterrupted without accidental screen switching.
            - **Hardware-Accelerated 2D Vertex Cache**: Replaced CPU-heavy bezier arc re-tessellation with native hardware rounded rectangles, eliminating micro-stutters during high-speed scrolling.
            - **Instant Tactile Feedback**: Gold buttons now register visual press feedback immediately on touch down.
            - **Verified Signature**: Signed with 2048-bit RSA key across APK Signature Schemes v1, v2, and v3 under package domain `com.universalmedia`.
          files: android_app/bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
