name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      publish_release:
        description: 'Publish GitHub Release (release builds only)'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Optional custom release tag (e.g. v2.0.0). If empty, a non-colliding build tag is used.'
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
    paths:
      - 'main.py'
      - 'downloader_engine.py'
      - 'buildozer.spec'
      - 'requirements.txt'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/build_apk.yml'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    paths:
      - 'main.py'
      - 'downloader_engine.py'
      - 'buildozer.spec'
      - 'requirements.txt'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/build_apk.yml'

permissions:
  contents: read

jobs:
  test:
    name: Run Regression & Security Tests
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py"

  build-apk:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      build_mode: ${{ steps.mode.outputs.build_mode }}
      artifact_name: ${{ steps.mode.outputs.artifact_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Android SDK Platform 36 & Build Tools
        run: |
          echo "Ensuring Android SDK Platform 36 & Build Tools are installed..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true

      - name: Install Buildozer & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython virtualenv "git+https://github.com/kivy/python-for-android.git"

      - name: Determine Build Type and Extract Release Configuration
        id: mode
        run: |
          APP_VER=$(grep -E '^\s*version\s*=' buildozer.spec | cut -d '=' -f2 | tr -d ' ')
          if [ -z "$APP_VER" ]; then APP_VER="2.0.0"; fi
          echo "app_version=$APP_VER" >> $GITHUB_OUTPUT
          echo "Configured App Version: $APP_VER"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "build_mode=debug" >> $GITHUB_OUTPUT
            echo "artifact_name=UniversalDownloader-Android-Debug-APK" >> $GITHUB_OUTPUT
            echo "Selected Build Mode: debug (Pull Request)"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build_mode=${{ github.event.inputs.build_type }}" >> $GITHUB_OUTPUT
            if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
              echo "artifact_name=UniversalDownloader-Android-Release-APK" >> $GITHUB_OUTPUT
            else
              echo "artifact_name=UniversalDownloader-Android-Debug-APK" >> $GITHUB_OUTPUT
            fi
            echo "Selected Build Mode: ${{ github.event.inputs.build_type }} (Manual Dispatch)"
          elif [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "build_mode=release" >> $GITHUB_OUTPUT
            echo "artifact_name=UniversalDownloader-Android-Release-APK" >> $GITHUB_OUTPUT
            echo "Selected Build Mode: release (Tagged Release Push)"
          else
            echo "build_mode=debug" >> $GITHUB_OUTPUT
            echo "artifact_name=UniversalDownloader-Android-Debug-APK" >> $GITHUB_OUTPUT
            echo "Selected Build Mode: debug (Main Branch Push CI Validation)"
          fi

      - name: Clean Previous Build Artifacts
        run: |
          rm -rf bin dist_apk .buildozer/android/platform/build-*/dists/*/build/outputs/apk
          mkdir -p bin dist_apk

      - name: Validate Release Secrets & Setup Keystore
        if: steps.mode.outputs.build_mode == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWD: ${{ secrets.RELEASE_KEYSTORE_PASSWD }}
          KEYALIAS: ${{ secrets.RELEASE_KEYALIAS }}
          KEYALIAS_PASSWD: ${{ secrets.RELEASE_KEYALIAS_PASSWD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWD" ] || [ -z "$KEYALIAS" ] || [ -z "$KEYALIAS_PASSWD" ]; then
            echo "::error::Production release requires all 4 secrets: RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWD, RELEASE_KEYALIAS, and RELEASE_KEYALIAS_PASSWD."
            echo "::error::Failing safely. Refusing to build an unsigned or ephemerally signed production release."
            exit 1
          fi

          mkdir -p ~/.keystores
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.keystores/release.keystore
          chmod 600 ~/.keystores/release.keystore
          echo "Production release keystore configured securely."

      - name: Build Release APK with Buildozer
        if: steps.mode.outputs.build_mode == 'release'
        env:
          P4A_RELEASE_KEYSTORE: /home/runner/.keystores/release.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.RELEASE_KEYSTORE_PASSWD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.RELEASE_KEYALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.RELEASE_KEYALIAS_PASSWD }}
        run: |
          yes | buildozer -v android release

      - name: Inspect, Align & Validate Release APK Signing
        if: steps.mode.outputs.build_mode == 'release'
        env:
          KEY_PASS: ${{ secrets.RELEASE_KEYALIAS_PASSWD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEYALIAS }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWD }}
          TRUSTED_CERT_SECRET: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -V | tail -n 1)
          echo "Found apksigner at: $APKSIGNER"
          echo "Found zipalign at: $ZIPALIGN"

          RELEASE_APKS=(bin/*.apk)
          if [ ! -f "${RELEASE_APKS[0]}" ]; then
            echo "::error::No APK produced in bin/ by Buildozer release!"
            exit 1
          fi

          raw_apk="${RELEASE_APKS[0]}"
          echo "Buildozer produced APK: $raw_apk"

          # Determine whether Buildozer / Gradle already signed the APK
          set +e
          $APKSIGNER verify --verbose "$raw_apk" > /tmp/apksigner_check.log 2>&1
          ALREADY_SIGNED=$?
          set -e

          if [ $ALREADY_SIGNED -eq 0 ]; then
            echo "APK is already signed. Verifying signing identity against trusted certificate..."
            target_apk="$raw_apk"
          else
            echo "APK requires alignment and signature. Inspecting state..."
            cat /tmp/apksigner_check.log || true

            target_apk="$raw_apk"
            if [[ "$raw_apk" == *"-unsigned.apk"* ]] || [[ "$raw_apk" == *"-unaligned.apk"* ]]; then
              aligned_apk="${raw_apk/-unsigned.apk/-aligned.apk}"
              aligned_apk="${aligned_apk/-unaligned.apk/-aligned.apk}"
              $ZIPALIGN -f -v -p 4 "$raw_apk" "$aligned_apk"
              target_apk="$aligned_apk"
            else
              $ZIPALIGN -c 4 "$raw_apk" || {
                $ZIPALIGN -f -v -p 4 "$raw_apk" "bin/aligned_temp.apk"
                target_apk="bin/aligned_temp.apk"
              }
            fi

            echo "Signing $target_apk with release keystore..."
            $APKSIGNER sign \
              --ks /home/runner/.keystores/release.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KS_PASS" \
              --key-pass "pass:$KEY_PASS" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --v4-signing-enabled false \
              "$target_apk"
          fi

          # Production APK Signature & Identity Verification
          echo "Executing rigorous cryptographic signature verification:"
          set +e
          $APKSIGNER verify --print-certs --verbose "$target_apk" > /tmp/cert_verify.log 2>&1
          SIGN_STATUS=$?
          set -e

          cat /tmp/cert_verify.log

          if [ $SIGN_STATUS -ne 0 ]; then
            echo "::error::Production APK signature verification failed! The APK is unsigned or invalidly signed."
            exit 1
          fi

          # Extract actual certificate SHA-256 fingerprint from the APK
          ACTUAL_CERT_FP=$(grep -i "certificate SHA-256 digest:" /tmp/cert_verify.log | head -n 1 | awk '{print $NF}' | tr '[:upper:]' '[:lower:]' | tr -d ':')
          if [ -z "$ACTUAL_CERT_FP" ]; then
            echo "::error::Failed to extract certificate SHA-256 fingerprint from APK!"
            exit 1
          fi

          # Extract Subject DN and fail if signed with Android Debug certificate
          if grep -i "CN=Android Debug" /tmp/cert_verify.log || grep -i "O=Android" /tmp/cert_verify.log; then
            echo "::error::Production APK is signed with Android Debug certificate! Failing build."
            exit 1
          fi

          # Compute expected SHA-256 fingerprint directly from trusted release keystore
          EXPECTED_KS_FP=$(keytool -exportcert -alias "$KEY_ALIAS" -keystore /home/runner/.keystores/release.keystore -storepass "$KS_PASS" | sha256sum | awk '{print $1}' | tr '[:upper:]' '[:lower:]' | tr -d ':')
          
          echo "=== SIGNATURE FINGERPRINT VERIFICATION ==="
          echo "Expected Keystore Certificate SHA-256: $EXPECTED_KS_FP"
          echo "Actual APK Signer Certificate SHA-256:  $ACTUAL_CERT_FP"

          if [ "$ACTUAL_CERT_FP" != "$EXPECTED_KS_FP" ]; then
            echo "::error::Signing identity mismatch! The APK was signed with an unexpected certificate ($ACTUAL_CERT_FP vs $EXPECTED_KS_FP)."
            exit 1
          fi

          # If an explicit RELEASE_CERT_SHA256 secret is configured, cross-verify against it
          if [ -n "$TRUSTED_CERT_SECRET" ]; then
            TRUSTED_SECRET_FP=$(echo "$TRUSTED_CERT_SECRET" | tr '[:upper:]' '[:lower:]' | tr -d ': ')
            if [ "$ACTUAL_CERT_FP" != "$TRUSTED_SECRET_FP" ]; then
              echo "::error::APK certificate fingerprint does not match trusted RELEASE_CERT_SHA256 secret ($ACTUAL_CERT_FP vs $TRUSTED_SECRET_FP)!"
              exit 1
            fi
            echo "Cross-verified successfully against trusted RELEASE_CERT_SHA256 secret."
          fi

          # Verify modern signature scheme presence (v2 / v3)
          if ! grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/cert_verify.log && \
             ! grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" /tmp/cert_verify.log; then
            echo "::error::APK must be signed with APK Signature Scheme v2 or v3 for modern Android submission!"
            exit 1
          fi

          APP_VERSION="${{ steps.mode.outputs.app_version }}"
          FINAL_APK="dist_apk/UniversalDownloader-v${APP_VERSION}.apk"
          cp "$target_apk" "$FINAL_APK"
          echo "Final verified release APK: $FINAL_APK"
          APK_SHA=$(sha256sum "$FINAL_APK" | awk '{print $1}')
          echo "APK SHA-256: $APK_SHA"

      - name: Build Debug APK with Buildozer
        if: steps.mode.outputs.build_mode == 'debug'
        run: |
          yes | buildozer -v android debug
          DEBUG_APKS=(bin/*.apk)
          if [ ! -f "${DEBUG_APKS[0]}" ]; then
            echo "::error::No debug APK produced in bin/ by Buildozer!"
            exit 1
          fi
          APP_VERSION="${{ steps.mode.outputs.app_version }}"
          DEBUG_APK="dist_apk/UniversalDownloader-v${APP_VERSION}-debug.apk"
          cp "${DEBUG_APKS[0]}" "$DEBUG_APK"
          echo "Final debug APK: $DEBUG_APK"
          sha256sum "$DEBUG_APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mode.outputs.artifact_name }}
          path: dist_apk/*.apk
          if-no-files-found: error

  publish-release:
    name: Publish Production GitHub Release
    needs: [test, build-apk]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release' && github.event.inputs.publish_release == true)
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built Release APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: UniversalDownloader-Android-Release-APK
          path: dist_apk

      - name: Determine Non-Colliding Release Tag
        id: release_meta
        run: |
          APP_VERSION=$(grep -E '^\s*version\s*=' buildozer.spec | cut -d '=' -f2 | tr -d ' ')
          if [ -z "$APP_VERSION" ]; then APP_VERSION="2.0.0"; fi
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT

          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          else
            TAG_NAME="v${APP_VERSION}-release.build-${{ github.run_number }}.${{ github.run_attempt }}"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Target Release Tag: $TAG_NAME"

      - name: Create GitHub Release with Verified APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: Universal Downloader Android APK ${{ steps.release_meta.outputs.tag_name }}
          body: |
            ### Universal Downloader for Android (v${{ steps.release_meta.outputs.app_version }}) - Production Release
            - **Target Android API**: Aligned with Google Play submission requirements (Target API 36: Android 16).
            - **Cryptographic Signature Verification**: Verified via `apksigner` with release certificate SHA-256 fingerprint matching the trusted release identity.
            - **Storage Access Framework (SAF) & MediaStore**: Compliant Scoped Storage with least-privilege permissions (`INTERNET`, `ACCESS_NETWORK_STATE`).
            - **Security & Integrity**: Zero debuggable flags (`android:debuggable="false"`), strict TLS certificate verification, and 28 regression tests executed and passed in CI.
          files: dist_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
