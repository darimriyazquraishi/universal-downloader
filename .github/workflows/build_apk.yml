name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - main
    paths:
      - 'android_app/**'
      - '.github/workflows/build_apk.yml'
      - 'tests/**'
      - 'requirements.txt'
  pull_request:
    branches:
      - main
    paths:
      - 'android_app/**'
      - '.github/workflows/build_apk.yml'
      - 'tests/**'
      - 'requirements.txt'

permissions:
  contents: write

jobs:
  test:
    name: Run Regression & Security Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r android_app/requirements.txt
          pip install certifi yt-dlp requests

      - name: Run Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py"

  build-apk:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Determine Build Type
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "build_mode=debug" >> $GITHUB_OUTPUT
            echo "Selected Build Mode: debug (Pull Request)"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build_mode=${{ github.event.inputs.build_type }}" >> $GITHUB_OUTPUT
            echo "Selected Build Mode: ${{ github.event.inputs.build_type }} (Manual Dispatch)"
          else
            echo "build_mode=release" >> $GITHUB_OUTPUT
            echo "Selected Build Mode: release (Push to Main)"
          fi

      - name: Clean Previous Build Artifacts
        run: |
          rm -rf android_app/bin dist_apk
          mkdir -p dist_apk

      - name: Validate Release Secrets & Setup Keystore
        if: steps.mode.outputs.build_mode == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWD: ${{ secrets.RELEASE_KEYSTORE_PASSWD }}
          KEYALIAS: ${{ secrets.RELEASE_KEYALIAS }}
          KEYALIAS_PASSWD: ${{ secrets.RELEASE_KEYALIAS_PASSWD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWD" ] || [ -z "$KEYALIAS" ] || [ -z "$KEYALIAS_PASSWD" ]; then
            echo "::error::Production release requires all 4 secrets: RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWD, RELEASE_KEYALIAS, and RELEASE_KEYALIAS_PASSWD."
            echo "::error::Failing safely. Refusing to build an unsigned or ephemerally signed production release."
            exit 1
          fi

          mkdir -p ~/.keystores
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.keystores/release.keystore
          chmod 600 ~/.keystores/release.keystore
          echo "Production release keystore configured securely."

      - name: Build Release APK with Buildozer
        if: steps.mode.outputs.build_mode == 'release'
        working-directory: ./android_app
        env:
          P4A_RELEASE_KEYSTORE: /home/runner/.keystores/release.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.RELEASE_KEYSTORE_PASSWD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.RELEASE_KEYALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.RELEASE_KEYALIAS_PASSWD }}
        run: |
          yes | buildozer -v android release

      - name: Production Align & Sign APK with apksigner
        if: steps.mode.outputs.build_mode == 'release'
        env:
          KEY_PASS: ${{ secrets.RELEASE_KEYALIAS_PASSWD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEYALIAS }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWD }}
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -V | tail -n 1)
          echo "Found apksigner at: $APKSIGNER"
          echo "Found zipalign at: $ZIPALIGN"

          RELEASE_APKS=(android_app/bin/*.apk)
          if [ ! -f "${RELEASE_APKS[0]}" ]; then
            echo "::error::No APK produced in android_app/bin by Buildozer!"
            exit 1
          fi

          target_apk="${RELEASE_APKS[0]}"
          echo "Processing generated APK: $target_apk"

          if [[ "$target_apk" == *"-unsigned.apk"* ]] || [[ "$target_apk" == *"-unaligned.apk"* ]]; then
            aligned_apk="${target_apk/-unsigned.apk/-aligned.apk}"
            aligned_apk="${aligned_apk/-unaligned.apk/-aligned.apk}"
            $ZIPALIGN -f -v -p 4 "$target_apk" "$aligned_apk"
            target_apk="$aligned_apk"
          fi

          echo "Signing $target_apk with release keystore..."
          $APKSIGNER sign \
            --ks /home/runner/.keystores/release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            "$target_apk"

          $APKSIGNER verify --verbose "$target_apk"
          cp "$target_apk" dist_apk/UniversalDownloader-v1.1.0.apk
          echo "Final verified release APK: dist_apk/UniversalDownloader-v1.1.0.apk"
          ls -la dist_apk/

      - name: Build Debug APK with Buildozer
        if: steps.mode.outputs.build_mode == 'debug'
        working-directory: ./android_app
        run: |
          yes | buildozer -v android debug
          DEBUG_APKS=(bin/*.apk)
          if [ ! -f "${DEBUG_APKS[0]}" ]; then
            echo "::error::No debug APK produced in android_app/bin by Buildozer!"
            exit 1
          fi
          cp "${DEBUG_APKS[0]}" ../dist_apk/UniversalDownloader-v1.1.0-debug.apk
          echo "Final debug APK: dist_apk/UniversalDownloader-v1.1.0-debug.apk"
          ls -la ../dist_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mode.outputs.build_mode == 'release' && 'UniversalDownloader-Android-Release-APK' || 'UniversalDownloader-Android-Debug-APK' }}
          path: dist_apk/*.apk
          if-no-files-found: error

      - name: Create GitHub Release with Production APK
        uses: softprops/action-gh-release@v2
        if: steps.mode.outputs.build_mode == 'release' && github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0-mobile
          name: Universal Downloader Android APK v1.1.0 (Production Release)
          body: |
            ### 📱 Universal Downloader for Android (v1.1.0) - Production Release
            - **Google Play Protect Compliance**: Hardened release build with verified TLS certificate validation.
            - **Secure Cryptographic Signing**: Signed with release keystore across APK Signature Schemes v1, v2, and v3 under package domain `com.universalmedia`.
            - **Scoped Storage & MediaStore Compliance**: Least-privilege permissions (`INTERNET`, `ACCESS_NETWORK_STATE`).
            - **Zero Debug Flags**: `android:debuggable="false"` strictly enforced.
            - **Continuous Automated Testing**: 100% test pass rate in CI prior to binary artifact packaging.
          files: dist_apk/UniversalDownloader-v1.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
