name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      publish_release:
        description: 'Publish GitHub Release (release builds only)'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Optional custom release tag (e.g. v2.0.0). If empty, a non-colliding build tag is used.'
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
    paths:
      - 'main.py'
      - 'downloader_engine.py'
      - 'buildozer.spec'
      - 'requirements.txt'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/build_apk.yml'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    paths:
      - 'main.py'
      - 'downloader_engine.py'
      - 'buildozer.spec'
      - 'requirements.txt'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/build_apk.yml'

permissions:
  contents: read

jobs:
  test:
    name: Run Regression & Security Tests
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      tests_total: ${{ steps.run_tests.outputs.tests_total }}
      tests_passed: ${{ steps.run_tests.outputs.tests_passed }}
      tests_failed: ${{ steps.run_tests.outputs.tests_failed }}
      tests_skipped: ${{ steps.run_tests.outputs.tests_skipped }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite & Capture Actual Results
        id: run_tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          python -c '
          import os, unittest
          loader = unittest.TestLoader()
          suite = loader.discover("tests", pattern="test_*.py")
          result = unittest.TextTestRunner(stream=open(os.devnull, "w")).run(suite)
          total = result.testsRun
          failed = len(result.failures) + len(result.errors)
          skipped = len(result.skipped)
          passed = total - failed - skipped
          print(f"Dynamic Test Summary: Total={total}, Passed={passed}, Failed={failed}, Skipped={skipped}")
          gh_out = os.environ.get("GITHUB_OUTPUT")
          if gh_out:
              with open(gh_out, "a") as f:
                  f.write(f"tests_total={total}\n")
                  f.write(f"tests_passed={passed}\n")
                  f.write(f"tests_failed={failed}\n")
                  f.write(f"tests_skipped={skipped}\n")
          '

  build-apk:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      build_mode: ${{ steps.mode.outputs.build_mode }}
      artifact_name: ${{ steps.mode.outputs.artifact_name }}
      app_version: ${{ steps.mode.outputs.app_version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Android SDK Platform 36 & Build Tools
        run: |
          echo "Installing pinned Android SDK Platform 36 and Build Tools 36.0.0..."
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Verify Android SDK Components
        run: |
          echo "Verifying mandatory Android SDK components are present..."
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            echo "::error::Mandatory Android SDK Platform 36 component missing in $ANDROID_HOME/platforms/android-36!"
            exit 1
          fi
          if [ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            echo "::error::Mandatory Android Build Tools 36.0.0 component missing in $ANDROID_HOME/build-tools/36.0.0!"
            exit 1
          fi
          if [ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            echo "::error::apksigner not found in $ANDROID_HOME/build-tools/36.0.0!"
            exit 1
          fi
          if [ ! -x "$ANDROID_HOME/build-tools/36.0.0/zipalign" ]; then
            echo "::error::zipalign not found in $ANDROID_HOME/build-tools/36.0.0!"
            exit 1
          fi
          if [ ! -d "$ANDROID_HOME/platform-tools" ]; then
            echo "::error::Android platform-tools component missing in $ANDROID_HOME/platform-tools!"
            exit 1
          fi
          echo "[OK] Android SDK Platform 36, Build Tools 36.0.0, and platform-tools verified successfully."

      - name: Install Buildozer & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython virtualenv "git+https://github.com/kivy/python-for-android.git"

      - name: Determine Build Type and Extract Release Configuration
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BUILD_TYPE: ${{ github.event.inputs.build_type }}
          REF: ${{ github.ref }}
        run: |
          APP_VER=$(grep -E '^\s*version\s*=' buildozer.spec | cut -d '=' -f2 | tr -d ' ')
          if [ -z "$APP_VER" ]; then APP_VER="2.0.0"; fi
          if ! [[ "$APP_VER" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Invalid version in buildozer.spec: $APP_VER"
            exit 1
          fi
          echo "app_version=$APP_VER" >> "$GITHUB_OUTPUT"
          echo "Configured App Version: $APP_VER"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "build_mode=debug" >> "$GITHUB_OUTPUT"
            echo "artifact_name=UniversalDownloader-Android-Debug-APK" >> "$GITHUB_OUTPUT"
            echo "Selected Build Mode: debug (Pull Request - signing secrets withheld)"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$INPUT_BUILD_TYPE" = "release" ]; then
              echo "build_mode=release" >> "$GITHUB_OUTPUT"
              echo "artifact_name=UniversalDownloader-Android-Release-APK" >> "$GITHUB_OUTPUT"
              echo "Selected Build Mode: release (Manual Dispatch)"
            elif [ "$INPUT_BUILD_TYPE" = "debug" ]; then
              echo "build_mode=debug" >> "$GITHUB_OUTPUT"
              echo "artifact_name=UniversalDownloader-Android-Debug-APK" >> "$GITHUB_OUTPUT"
              echo "Selected Build Mode: debug (Manual Dispatch)"
            else
              echo "::error::Invalid build_type input: '$INPUT_BUILD_TYPE'. Must be 'release' or 'debug'."
              exit 1
            fi
          elif [ "$EVENT_NAME" = "push" ] && [[ "$REF" == refs/tags/v* ]]; then
            echo "build_mode=release" >> "$GITHUB_OUTPUT"
            echo "artifact_name=UniversalDownloader-Android-Release-APK" >> "$GITHUB_OUTPUT"
            echo "Selected Build Mode: release (Tagged Release Push)"
          else
            echo "build_mode=debug" >> "$GITHUB_OUTPUT"
            echo "artifact_name=UniversalDownloader-Android-Debug-APK" >> "$GITHUB_OUTPUT"
            echo "Selected Build Mode: debug (Main Branch CI Validation)"
          fi

      - name: Clean Previous Build Artifacts
        run: |
          rm -rf bin dist_apk .buildozer/android/platform/build-*/dists/*/build/outputs/apk
          mkdir -p bin dist_apk

      - name: Validate Release Secrets & Setup Keystore
        if: steps.mode.outputs.build_mode == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWD: ${{ secrets.RELEASE_KEYSTORE_PASSWD }}
          KEYALIAS: ${{ secrets.RELEASE_KEYALIAS }}
          KEYALIAS_PASSWD: ${{ secrets.RELEASE_KEYALIAS_PASSWD }}
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          # 1. Enforce mandatory presence of all 5 release signing secrets
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWD" ] || [ -z "$KEYALIAS" ] || [ -z "$KEYALIAS_PASSWD" ] || [ -z "$RELEASE_CERT_SHA256" ]; then
            echo "::error::Production release requires all 5 secrets: RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWD, RELEASE_KEYALIAS, RELEASE_KEYALIAS_PASSWD, and RELEASE_CERT_SHA256."
            echo "::error::Failing safely. Refusing to build an unsigned, ephemerally signed, or untrusted production release."
            exit 1
          fi

          # 2. Validate SHA-256 format and normalize hexadecimal characters and separators
          CLEAN_FP=$(echo "$RELEASE_CERT_SHA256" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          if ! [[ "$CLEAN_FP" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::RELEASE_CERT_SHA256 format is invalid! Must be a 64-character hexadecimal SHA-256 string (with or without colons/spaces)."
            exit 1
          fi

          mkdir -p ~/.keystores
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.keystores/release.keystore
          chmod 600 ~/.keystores/release.keystore
          echo "Production release keystore configured securely."

      - name: Build Release APK with Buildozer
        if: steps.mode.outputs.build_mode == 'release'
        env:
          P4A_RELEASE_KEYSTORE: /home/runner/.keystores/release.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.RELEASE_KEYSTORE_PASSWD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.RELEASE_KEYALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.RELEASE_KEYALIAS_PASSWD }}
        run: |
          yes | buildozer -v android release

      - name: Inspect, Align & Independently Validate Release APK Signing
        if: steps.mode.outputs.build_mode == 'release'
        env:
          KEY_PASS: ${{ secrets.RELEASE_KEYALIAS_PASSWD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEYALIAS }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWD }}
          TRUSTED_CERT_SECRET: ${{ secrets.RELEASE_CERT_SHA256 }}
          APP_VERSION: ${{ steps.mode.outputs.app_version }}
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -V | tail -n 1)
          echo "Found apksigner at: $APKSIGNER"
          echo "Found zipalign at: $ZIPALIGN"

          RELEASE_APKS=(bin/*.apk)
          if [ ! -f "${RELEASE_APKS[0]}" ]; then
            echo "::error::No APK produced in bin/ by Buildozer release!"
            exit 1
          fi

          raw_apk="${RELEASE_APKS[0]}"
          echo "Buildozer produced APK: $raw_apk"

          # Determine whether Buildozer / Gradle already signed the APK
          set +e
          "$APKSIGNER" verify --verbose "$raw_apk" > /tmp/apksigner_check.log 2>&1
          ALREADY_SIGNED=$?
          set -e

          if [ $ALREADY_SIGNED -eq 0 ]; then
            echo "APK is already signed. Verifying signing identity against trusted certificate..."
            target_apk="$raw_apk"
          else
            echo "APK requires alignment and signature. Inspecting state..."
            if [ -f /tmp/apksigner_check.log ]; then
              cat /tmp/apksigner_check.log
            fi

            target_apk="$raw_apk"
            if [[ "$raw_apk" == *"-unsigned.apk"* ]] || [[ "$raw_apk" == *"-unaligned.apk"* ]]; then
              aligned_apk="${raw_apk/-unsigned.apk/-aligned.apk}"
              aligned_apk="${aligned_apk/-unaligned.apk/-aligned.apk}"
              "$ZIPALIGN" -f -v -p 4 "$raw_apk" "$aligned_apk"
              target_apk="$aligned_apk"
            else
              "$ZIPALIGN" -c 4 "$raw_apk" || {
                "$ZIPALIGN" -f -v -p 4 "$raw_apk" "bin/aligned_temp.apk"
                target_apk="bin/aligned_temp.apk"
              }
            fi

            echo "Signing $target_apk with release keystore..."
            "$APKSIGNER" sign \
              --ks /home/runner/.keystores/release.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KS_PASS" \
              --key-pass "pass:$KEY_PASS" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --v4-signing-enabled false \
              "$target_apk"
          fi

          # Production APK Signature & Identity Verification
          echo "Executing rigorous cryptographic signature verification:"
          set +e
          "$APKSIGNER" verify --print-certs --verbose "$target_apk" > /tmp/cert_verify.log 2>&1
          SIGN_STATUS=$?
          set -e

          cat /tmp/cert_verify.log

          if [ $SIGN_STATUS -ne 0 ]; then
            echo "::error::Production APK signature verification failed! The APK is unsigned or invalidly signed."
            exit 1
          fi

          # Extract actual certificate SHA-256 fingerprint from the APK
          ACTUAL_CERT_FP=$(grep -i "certificate SHA-256 digest:" /tmp/cert_verify.log | head -n 1 | awk '{print $NF}' | tr '[:upper:]' '[:lower:]' | tr -d ':')
          if [ -z "$ACTUAL_CERT_FP" ]; then
            echo "::error::Failed to extract certificate SHA-256 fingerprint from APK!"
            exit 1
          fi

          # Reject debug identities
          if grep -i "CN=Android Debug" /tmp/cert_verify.log || grep -i "O=Android" /tmp/cert_verify.log; then
            echo "::error::Production APK is signed with Android Debug certificate! Failing build."
            exit 1
          fi

          # Normalize mandatory trusted fingerprint secret
          NORMALIZED_TRUSTED_FP=$(echo "$TRUSTED_CERT_SECRET" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          if ! [[ "$NORMALIZED_TRUSTED_FP" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Mandatory RELEASE_CERT_SHA256 secret is invalid format: $TRUSTED_CERT_SECRET"
            exit 1
          fi

          # Also extract keystore fingerprint for comparison
          EXPECTED_KS_FP=$(keytool -exportcert -alias "$KEY_ALIAS" -keystore /home/runner/.keystores/release.keystore -storepass "$KS_PASS" | sha256sum | awk '{print $1}' | tr '[:upper:]' '[:lower:]' | tr -d ':')

          echo "=== SIGNATURE FINGERPRINT VERIFICATION ==="
          echo "Independent Trusted SHA-256:       $NORMALIZED_TRUSTED_FP"
          echo "Actual APK Signer SHA-256:         $ACTUAL_CERT_FP"
          echo "Supplied Keystore Certificate SHA: $EXPECTED_KS_FP"

          # 1. Independent trust verification: APK signer must match the independent trusted fingerprint
          if [ "$ACTUAL_CERT_FP" != "$NORMALIZED_TRUSTED_FP" ]; then
            echo "::error::Independent trust verification failed! Actual APK signer certificate ($ACTUAL_CERT_FP) does not match trusted RELEASE_CERT_SHA256 ($NORMALIZED_TRUSTED_FP)."
            exit 1
          fi

          # 2. Supplied keystore must also match the independent trusted identity
          if [ "$EXPECTED_KS_FP" != "$NORMALIZED_TRUSTED_FP" ]; then
            echo "::error::Supplied keystore does not match trusted RELEASE_CERT_SHA256 ($EXPECTED_KS_FP vs $NORMALIZED_TRUSTED_FP)!"
            exit 1
          fi

          echo "[OK] Independent cryptographic identity successfully verified against RELEASE_CERT_SHA256."

          # Verify modern signature scheme presence (v2 / v3)
          if ! grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/cert_verify.log && \
             ! grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" /tmp/cert_verify.log; then
            echo "::error::APK must be signed with APK Signature Scheme v2 or v3 for modern Android submission!"
            exit 1
          fi

          FINAL_APK="dist_apk/UniversalDownloader-v${APP_VERSION}.apk"
          cp "$target_apk" "$FINAL_APK"
          echo "Final verified release APK: $FINAL_APK"
          APK_SHA=$(sha256sum "$FINAL_APK" | awk '{print $1}')
          echo "APK SHA-256: $APK_SHA"

          # Verify compiled APK manifest (targetSdkVersion 36)
          AAPT=$(find $ANDROID_HOME/build-tools -name aapt | sort -V | tail -n 1)
          if [ -x "$AAPT" ]; then
            echo "Inspecting compiled APK manifest via aapt..."
            "$AAPT" dump badging "$FINAL_APK" > /tmp/apk_badging.txt
            if ! grep -q "targetSdkVersion:'36'" /tmp/apk_badging.txt; then
              echo "::error::Compiled APK does not target API 36!"
              cat /tmp/apk_badging.txt
              exit 1
            fi
            echo "[OK] Compiled APK verified targeting Android API 36."
          fi

      - name: Build Debug APK with Buildozer
        if: steps.mode.outputs.build_mode == 'debug'
        env:
          APP_VERSION: ${{ steps.mode.outputs.app_version }}
        run: |
          yes | buildozer -v android debug
          DEBUG_APKS=(bin/*.apk)
          if [ ! -f "${DEBUG_APKS[0]}" ]; then
            echo "::error::No debug APK produced in bin/ by Buildozer!"
            exit 1
          fi
          DEBUG_APK="dist_apk/UniversalDownloader-v${APP_VERSION}-debug.apk"
          cp "${DEBUG_APKS[0]}" "$DEBUG_APK"
          echo "Final debug APK: $DEBUG_APK"
          sha256sum "$DEBUG_APK"

          # Verify compiled debug APK manifest
          AAPT=$(find $ANDROID_HOME/build-tools -name aapt | sort -V | tail -n 1)
          if [ -x "$AAPT" ]; then
            echo "Inspecting compiled debug APK manifest..."
            "$AAPT" dump badging "$DEBUG_APK" > /tmp/debug_badging.txt
            if ! grep -q "targetSdkVersion:'36'" /tmp/debug_badging.txt; then
              echo "::error::Compiled APK does not target API 36!"
              cat /tmp/debug_badging.txt
              exit 1
            fi
            echo "[OK] Compiled debug APK verified targeting Android API 36."
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mode.outputs.artifact_name }}
          path: dist_apk/*.apk
          if-no-files-found: error

  publish-release:
    name: Publish Production GitHub Release
    needs: [test, build-apk]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release' && github.event.inputs.publish_release == true)
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Built Release APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: UniversalDownloader-Android-Release-APK
          path: dist_apk

      - name: Validate and Determine Non-Colliding Release Tag
        id: release_meta
        env:
          EVENT_REF_TYPE: ${{ github.ref_type }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          APP_VERSION=$(grep -E '^\s*version\s*=' buildozer.spec | cut -d '=' -f2 | tr -d ' ')
          if [ -z "$APP_VERSION" ]; then APP_VERSION="2.0.0"; fi
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_REF_TYPE" = "tag" ]; then
            RAW_TAG="$EVENT_REF_NAME"
            IS_MANUAL=false
          elif [ -n "$INPUT_RELEASE_TAG" ]; then
            RAW_TAG="$INPUT_RELEASE_TAG"
            IS_MANUAL=true
          else
            RAW_TAG="v${APP_VERSION}-release.build-${RUN_NUMBER}.${RUN_ATTEMPT}"
            IS_MANUAL=false
          fi

          # 1. Enforce strict character validation on tag name (eliminate shell & reference injection)
          if ! [[ "$RAW_TAG" =~ ^v?[0-9A-Za-z._-]+$ ]]; then
            echo "::error::Tag name '$RAW_TAG' contains invalid characters! Only alphanumeric, dots, hyphens, and underscores are allowed."
            exit 1
          fi

          # 2. Enforce standard git check-ref-format
          if ! git check-ref-format --allow-onelevel "tags/$RAW_TAG"; then
            echo "::error::Tag name '$RAW_TAG' is not a valid Git reference name."
            exit 1
          fi

          # 3. If a tag was manually requested via input, check if it already exists and fail
          if [ "$IS_MANUAL" = true ]; then
            if git ls-remote --tags origin "refs/tags/$RAW_TAG" | grep -q "refs/tags/$RAW_TAG$"; then
              echo "::error::Manually requested release tag '$RAW_TAG' already exists on origin! Failing safely to prevent overwriting."
              exit 1
            fi
            if git tag -l "$RAW_TAG" | grep -q "^$RAW_TAG$"; then
              echo "::error::Manually requested release tag '$RAW_TAG' already exists locally! Failing safely to prevent overwriting."
              exit 1
            fi
          fi

          # 4. For automatic tags, ensure uniqueness
          if [ "$IS_MANUAL" = false ] && [ "$EVENT_REF_TYPE" != "tag" ]; then
            if git ls-remote --tags origin "refs/tags/$RAW_TAG" | grep -q "refs/tags/$RAW_TAG$"; then
              RAW_TAG="${RAW_TAG}.$(date +%s)"
            fi
          fi

          # Protect GITHUB_OUTPUT from newline injection
          echo "tag_name=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "Target Release Tag: $RAW_TAG"

      - name: Create GitHub Release with Verified APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: Universal Downloader Android APK ${{ steps.release_meta.outputs.tag_name }}
          body: |
            ### Universal Downloader for Android (v${{ steps.release_meta.outputs.app_version }}) - Production Release
            - **Target Android API**: Aligned with Google Play submission requirements (Target API 36: Android 16).
            - **Cryptographic Signature Verification**: Independently verified against trusted `RELEASE_CERT_SHA256` identity with modern APK Signature Scheme v2/v3.
            - **Storage Access Framework (SAF) & MediaStore**: Compliant Scoped Storage distinguishing SAF tree URIs, SAF document URIs, and MediaStore collections.
            - **Automated Test Results**: ${{ needs.test.outputs.tests_passed }} passed, ${{ needs.test.outputs.tests_skipped }} skipped (live network), ${{ needs.test.outputs.tests_failed }} failed out of ${{ needs.test.outputs.tests_total }} total regression tests in CI.
            - **Security & Integrity**: Zero debuggable flags (`android:debuggable="false"`), strict TLS certificate verification, and least-privilege permissions (`INTERNET`, `ACCESS_NETWORK_STATE`).
          files: dist_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
