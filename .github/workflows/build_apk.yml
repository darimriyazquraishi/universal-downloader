name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android_app/**'
      - '.github/workflows/build_apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer & Dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Build APK with Buildozer
        working-directory: ./android_app
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalDownloader-Android-APK
          path: android_app/bin/*.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.1-mobile
          name: Universal Downloader Android APK v1.0.1
          body: |
            ### 📱 Universal Downloader for Android (v1.0.0)
            - **Design**: Dark Obsidian & Radiant Gold luxury aesthetic
            - **Universal Engine**: Downloads video and audio from YouTube, Instagram, TikTok, Facebook, X, and more
            - **Output Profiles**: Separate Video (`MP4 Best`, `MP4 1080p`, `MP4 720p`, `MP4 480p`) & Audio (`MP3 320k`, `MP3 192k`, `USB 128k`, `AAC M4A`)
            - **Android Share Sheet**: Share links directly from any browser or social app into Universal Downloader
          files: android_app/bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
