name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android_app/**'
      - '.github/workflows/build_apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer & Dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Setup Permanent Release Keystore
        run: |
          mkdir -p ~/.keystores
          cp android_app/release.keystore ~/.keystores/release.keystore

      - name: Build Release APK with Buildozer
        working-directory: ./android_app
        env:
          P4A_RELEASE_KEYSTORE: /home/runner/.keystores/release.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: "Universal2026Media!"
          P4A_RELEASE_KEYALIAS: "universalmedia"
          P4A_RELEASE_KEYALIAS_PASSWD: "Universal2026Media!"
        run: |
          yes | buildozer -v android release

      - name: Production Align & Sign APK with apksigner (v1, v2, v3 schemes)
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -V | tail -n 1)
          echo "Found apksigner at: $APKSIGNER"
          echo "Found zipalign at: $ZIPALIGN"

          mkdir -p dist_apk
          for apk in android_app/bin/*.apk; do
            echo "Processing $apk..."
            target_apk="$apk"
            if [[ "$apk" == *"-unsigned.apk"* ]]; then
              aligned_apk="${apk/-unsigned.apk/-aligned.apk}"
              $ZIPALIGN -f -v -p 4 "$apk" "$aligned_apk"
              target_apk="$aligned_apk"
            elif [[ "$apk" == *"-unaligned.apk"* ]]; then
              aligned_apk="${apk/-unaligned.apk/-aligned.apk}"
              $ZIPALIGN -f -v -p 4 "$apk" "$aligned_apk"
              target_apk="$aligned_apk"
            fi

            echo "Signing $target_apk with permanent release keystore..."
            $APKSIGNER sign \
              --ks /home/runner/.keystores/release.keystore \
              --ks-key-alias universalmedia \
              --ks-pass pass:Universal2026Media! \
              --key-pass pass:Universal2026Media! \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --v4-signing-enabled false \
              "$target_apk"
            $APKSIGNER verify --verbose "$target_apk"
            cp "$target_apk" dist_apk/UniversalDownloader-v1.1.0.apk
          done
          echo "Final release asset ready:"
          ls -la dist_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalDownloader-Android-APK
          path: dist_apk/*.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0-mobile
          name: Universal Downloader Android APK v1.1.0 (Production Release)
          body: |
            ### 📱 Universal Downloader for Android (v1.1.0) - Production Release
            - **Google Play Protect Compliance**: Transitioned to an official `release` build, stripping `android:debuggable="true"` from the AndroidManifest.
            - **Permanent Cryptographic Identity**: Signed with a persistent 2048-bit RSA PKCS#12 release keystore across APK Signature Schemes v1, v2, and v3 under package domain `com.universalmedia`.
            - **Modern Scoped Storage Permissions**: Cleaned application permissions, removing legacy `WRITE_EXTERNAL_STORAGE` for full Android 13/14/15 Scoped Storage & MediaStore compliance.
            - **Smart Clipboard & Share Extraction**: Improved URL parser to extract links from shared social text even with intro titles or surrounding copy.
            - **Clean Download Manager**: Fixed first-launch history initialization to guarantee zero foreign media seeding.
            - **High-Refresh 120 FPS Fluidity**: Preserved zero-latency rendering, fluid list scrolling, and zero-conflict gesture isolation.
          files: dist_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
