name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android_app/**'
      - '.github/workflows/build_apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer & Dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Setup Custom Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Universal Downloader, OU=Media Distribution, O=Universal Media Inc, L=San Jose, ST=CA, C=US"

      - name: Build APK with Buildozer
        working-directory: ./android_app
        run: |
          yes | buildozer -v android debug

      - name: Production Sign APK with apksigner (v1, v2, v3 schemes)
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias universalmedia \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "Universal2026Media!" \
            -keypass "Universal2026Media!" \
            -dname "CN=Universal Downloader, OU=Media Distribution, O=Universal Media Inc, L=San Jose, ST=CA, C=US"

          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Found apksigner at: $APKSIGNER"

          for apk in android_app/bin/*.apk; do
            echo "Signing $apk with release keystore..."
            $APKSIGNER sign \
              --ks release.jks \
              --ks-key-alias universalmedia \
              --ks-pass pass:Universal2026Media! \
              --key-pass pass:Universal2026Media! \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --v4-signing-enabled false \
              "$apk"
            $APKSIGNER verify --verbose "$apk"
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalDownloader-Android-APK
          path: android_app/bin/*.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.7-mobile
          name: Universal Downloader Android APK v1.0.7
          body: |
            ### 📱 Universal Downloader for Android (v1.0.7)
            - **Resolved Android Download Crash**: Fixed fundamental Kivy `ProcessingStream` buffer incompatibility with `yt-dlp` error reporting that previously caused instant termination when downloading media.
            - **YouTube Client Extraction & Fallbacks**: Integrated dedicated mobile player client extractor args (`android`, `ios`, `web`) to ensure reliable retrieval of single-stream progressive MP4 and native audio streams without FFmpeg.
            - **Defensive Manager & File Intents**: Modernized `open_file` with Android StrictMode VmPolicy relaxation to eliminate `FileUriExposedException`, and replaced desktop file manager invocations with safe Android Intents.
            - **Protected Clock Event Loop**: Fully guarded all background thread UI callbacks with defensive try-except blocks to keep the Kivy application alive under all network edge cases.
            - **Verified Signature**: Clean production signature signed with 2048-bit RSA key across APK Signature Schemes v1, v2, and v3 under package domain `com.universalmedia`.
          files: android_app/bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
