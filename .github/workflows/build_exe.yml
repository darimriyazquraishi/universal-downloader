name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'gui_app.py'
      - 'build_exe.py'
      - 'Universal_Downloader.spec'
      - 'requirements-desktop.txt'
      - 'assets/**'
      - '.github/workflows/build_exe.yml'
    tags:
      - 'v*'

jobs:
  build:
    name: Build Universal Downloader Windows EXE
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt

      - name: Build Standalone Executable
        run: |
          python build_exe.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal_Downloader_Windows_x64
          path: dist/Universal_Downloader.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release (Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Universal_Downloader.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
